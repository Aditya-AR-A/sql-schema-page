<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Schema Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        #cy { width: 100%; height: 100%; }
        /* Custom scrollbar for sidebar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Custom scrollbar for detail panel */
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 2px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
    </style>
</head>
<body class="flex h-screen bg-gray-50">

    <!-- Sidebar -->
    <div class="w-80 flex flex-col bg-white border-r border-gray-200 z-10 shadow-sm flex-shrink-0">
        <div class="p-4 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
            <h1 class="text-lg font-bold text-gray-800">Schema Explorer</h1>
            <button id="clear-map-btn" class="text-xs bg-red-100 text-red-600 hover:bg-red-200 px-2 py-1 rounded font-semibold transition">Clear Map</button>
        </div>
        <div class="p-4 border-b border-gray-200">
            <div class="relative">
                <input type="text" id="search-input" placeholder="Search tables..." class="w-full pl-8 pr-3 py-2 bg-gray-100 border-transparent rounded-md text-sm focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-100 outline-none transition-all">
                <svg class="w-4 h-4 text-gray-400 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
        </div>
        <div class="flex-1 overflow-y-auto">
            <ul id="table-list" class="divide-y divide-gray-100">
                <!-- List items rendered by JS -->
            </ul>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 relative flex flex-col">
        <!-- Cytoscape Container -->
        <div id="cy" class="bg-gray-100 w-full h-full absolute inset-0 z-0" style="background-image: radial-gradient(#e5e7eb 1px, transparent 1px); background-size: 20px 20px;"></div>

        <!-- Detail Panel -->
        <div id="detail-panel" class="hidden absolute top-4 right-4 w-[400px] bg-white shadow-2xl rounded-xl border border-gray-200 z-10 flex flex-col max-h-[calc(100vh-2rem)] overflow-hidden transition-all duration-300 transform translate-x-0">
            <!-- Header -->
            <div class="p-4 border-b border-gray-100 bg-gray-50 flex justify-between items-center rounded-t-xl">
                <h2 id="detail-title" class="text-lg font-bold text-gray-800 break-all pr-2">Table Name</h2>
                <div class="flex space-x-1 flex-shrink-0">
                    <button id="remove-node-btn" class="p-1.5 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors" title="Remove from map">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                    <button id="close-detail-btn" class="p-1.5 text-gray-400 hover:text-gray-800 hover:bg-gray-200 rounded-lg transition-colors" title="Close details">

                    </button>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto custom-scroll p-4 space-y-6">
                <!-- Columns Section -->
                <div>
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Columns</h3>
                        <span id="col-count" class="text-xs bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full font-medium">0</span>
                    </div>
                    <div id="detail-columns" class="space-y-1">
                        <!-- Columns rendered by JS -->
                    </div>
                </div>

                <!-- Relationships Section -->
                <div>
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Relationships</h3>
                        <span id="rel-count" class="text-xs bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full font-medium">0</span>
                    </div>
                    <div id="detail-relationships" class="space-y-2">
                        <!-- Relationships rendered by JS -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Welcome Overlay -->
        <div id="welcome-overlay" class="absolute inset-0 z-0 flex items-center justify-center pointer-events-none">
            <div class="bg-white/90 backdrop-blur-sm p-8 rounded-2xl shadow-xl text-center max-w-md pointer-events-auto border border-gray-100">
                <div class="bg-indigo-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Schema Explorer</h2>
                <p class="text-sm text-gray-600 leading-relaxed mb-6">Select a table from the sidebar to start mapping your database relationships visually. You can follow foreign keys to traverse the schema.</p>
                <div class="flex justify-center space-x-4 text-xs text-gray-500">
                    <div class="flex items-center"><span class="w-2 h-2 rounded-full bg-indigo-500 mr-2"></span> Tables</div>
                    <div class="flex items-center"><span class="w-2 h-2 rounded-full bg-gray-400 mr-2"></span> Relationships</div>
                </div>
            </div>
        </div>

        <!-- Controls Overlay (Zoom/Fit) -->
        <div class="absolute bottom-6 right-6 z-10 flex flex-col space-y-2 bg-white shadow-lg rounded-lg border border-gray-200 p-1">
            <button id="zoom-in-btn" class="p-2 text-gray-600 hover:text-indigo-600 hover:bg-indigo-50 rounded transition-colors" title="Zoom In">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
            </button>
            <div class="h-px bg-gray-200 w-full"></div>
            <button id="zoom-out-btn" class="p-2 text-gray-600 hover:text-indigo-600 hover:bg-indigo-50 rounded transition-colors" title="Zoom Out">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
            </button>
            <div class="h-px bg-gray-200 w-full"></div>
            <button id="fit-btn" class="p-2 text-gray-600 hover:text-indigo-600 hover:bg-indigo-50 rounded transition-colors" title="Fit to Screen">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
            </button>
        </div>
    </div>

                        existingTableInfo.relationships.forEach(rel => {
                            if (rel.target_table === tableName) {
                                const edgeId = `${existingNodeName}-${tableName}-${rel.source_column}`;
                                if (!cy.getElementById(edgeId).length) {
                                    cy.add({
                                        data: {
                                            id: edgeId,
                                            source: rel.type === 'belongsTo' ? existingNodeName : tableName,
                                            target: rel.type === 'belongsTo' ? tableName : existingNodeName,
                                            label: rel.source_column
                                        }
                                    });
                                }
                            }
                        });
                    }
                });

                // Run layout to position new node
                cy.layout({
                    name: 'cose',
                    animate: true,
                    animationDuration: 300,
                    randomize: false, // Keep existing node positions
                    fit: true,
                    padding: 50,
                    nodeRepulsion: 400000,
                    idealEdgeLength: 150,
                    edgeElasticity: 100,
                    nestingFactor: 5,
                    gravity: 80,
                    numIter: 1000
                }).run();
            }

            // Select the node
            cy.nodes().unselect();
            cy.getElementById(tableName).select();
        }

        // Show Detail View
        function showDetailView(tableName) {
            const table = schemaData[tableName];
            if (!table) return;

            currentSelectedTable = tableName;

            document.getElementById('detail-title').innerText = table.name;
            document.getElementById('col-count').innerText = table.columns.length;
            document.getElementById('rel-count').innerText = table.relationships.length;

            // Render Columns
            const colsContainer = document.getElementById('detail-columns');
            colsContainer.innerHTML = '';
            table.columns.forEach(col => {
                let keyBadge = '';
                if (col.key === 'PRI') keyBadge = '<span class="bg-amber-100 text-amber-800 text-[10px] px-1.5 py-0.5 rounded ml-2 font-bold uppercase tracking-wider">PK</span>';
                else if (col.key === 'MUL' || col.key === 'UNI') keyBadge = '<span class="bg-blue-100 text-blue-800 text-[10px] px-1.5 py-0.5 rounded ml-2 font-bold uppercase tracking-wider">IDX</span>';

                const nullableLabel = col.nullable === 'YES' ? '<span class="text-[10px] text-gray-400 ml-1 italic">null</span>' : '';

                colsContainer.innerHTML += `
                    <div class="flex justify-between items-center py-2 border-b border-gray-50 last:border-0 hover:bg-gray-50 px-2 rounded-lg transition-colors">
                        <div class="flex items-center">
                            <span class="font-semibold text-gray-700 text-sm">${col.name}</span>
                            ${keyBadge}
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="text-indigo-600 font-mono text-xs bg-indigo-50/50 px-1.5 py-0.5 rounded border border-indigo-100/50">${col.type}</span>
                            ${nullableLabel}
                        </div>
                    </div>
                `;
            });

            // Render Relationships
            const relsContainer = document.getElementById('detail-relationships');
            relsContainer.innerHTML = '';
            if (table.relationships.length === 0) {
                relsContainer.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-6 text-center bg-gray-50 rounded-lg border border-dashed border-gray-200">
                        <svg class="w-8 h-8 text-gray-300 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                        <span class="text-gray-400 text-sm">No defined relationships</span>
                    </div>
                `;
            } else {
                table.relationships.forEach(rel => {
                    const isBelongsTo = rel.type === 'belongsTo';
                    const relTypeClass = isBelongsTo ? 'text-amber-600 bg-amber-50 border-amber-200' : 'text-emerald-600 bg-emerald-50 border-emerald-200';
                    const relIcon = isBelongsTo
                        ? '<svg class="w-3 h-3 ml-1 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>'
                        : '<svg class="w-3 h-3 ml-1 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16l-4-4m0 0l4-4m-4 4h18"></path></svg>';

                    relsContainer.innerHTML += `
                        <div class="p-3 border border-gray-100 hover:border-indigo-200 hover:shadow-md bg-white hover:bg-indigo-50/30 rounded-lg cursor-pointer transition-all group" onclick="handleRelClick('${rel.target_table}')">
                            <div class="flex justify-between items-center mb-2">
                                <div class="flex items-center">
                                    <span class="text-[10px] font-bold uppercase px-1.5 py-0.5 rounded border flex items-center ${relTypeClass}">
                                        ${rel.type} ${relIcon}
                                    </span>
                                    <span class="font-bold text-gray-800 text-sm ml-2 group-hover:text-indigo-700 transition-colors">${rel.target_table}</span>
                                </div>
                                <div class="bg-white rounded-full p-1 shadow-sm opacity-0 group-hover:opacity-100 transition-opacity">
                                    <svg class="w-3.5 h-3.5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                                </div>
                            </div>
                            <div class="flex items-center space-x-2 text-xs text-gray-500 bg-gray-50/50 p-1.5 rounded">
                                <span class="flex-1 truncate"><span class="text-gray-400">src:</span> <span class="font-mono text-gray-600">${rel.source_column}</span></span>
                                <svg class="w-3 h-3 text-gray-300 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path></svg>
                                <span class="flex-1 truncate text-right"><span class="text-gray-400">tgt:</span> <span class="font-mono text-gray-600">${rel.target_column}</span></span>
                            </div>
                        </div>
                    `;
                });
            }

            detailPanel.classList.remove('hidden');
        }

        window.handleRelClick = function(targetTable) {
            addTableToMap(targetTable);
            showDetailView(targetTable);
        };

        // Cy Events
        cy.on('tap', 'node', function(evt){
            var node = evt.target;
            showDetailView(node.id());
        });

        cy.on('tap', function(evt){
            if(evt.target === cy){
                detailPanel.classList.add('hidden');
                cy.nodes().unselect();
                currentSelectedTable = null;
            }
        });

        // Controls
        closeDetailBtn.addEventListener('click', () => {
            detailPanel.classList.add('hidden');
            cy.nodes().unselect();
            currentSelectedTable = null;
        });

        removeNodeBtn.addEventListener('click', () => {
            if (currentSelectedTable) {
                cy.remove(cy.getElementById(currentSelectedTable));
                detailPanel.classList.add('hidden');
                currentSelectedTable = null;

                if (cy.nodes().length === 0) {
                    welcomeOverlay.style.display = 'flex';
                } else {
                    // Adjust layout slightly after removal
                    cy.layout({
                        name: 'cose',
                        animate: true,
                        randomize: false,
                        fit: true,
                        padding: 50
                    }).run();
                }
            }
        });

        clearMapBtn.addEventListener('click', () => {
            cy.elements().remove();
            detailPanel.classList.add('hidden');
            currentSelectedTable = null;
            welcomeOverlay.style.display = 'flex';
        });

        // Initial render
        renderTableList();

    </script>
</body>
</html>
